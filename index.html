<style>
:root{color-scheme:dark;--bg:#000;--c1:#17171a;--c2:#232327;--c3:#2e2e33;--tx:#fff;--mut:#8e8e98;--acc:#30d85f;--gold:#ffc928}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:700 14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:auto;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.pill{display:flex;align-items:center;gap:8px;background:var(--c1);border-radius:99px;padding:8px 13px;font-size:13px}
.lvl i{width:46px;height:6px;border-radius:9px;background:var(--c3);overflow:hidden}.lvl u{display:block;height:100%;background:var(--acc);border-radius:9px}
.bal{margin-left:auto;text-align:right}.bal small{display:block;color:var(--mut);font-size:12px}.bal b{font-size:18px;letter-spacing:-.4px}
#main{flex:1;overflow-y:auto;padding:4px 12px 96px;-webkit-overflow-scrolling:touch}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(492px,calc(100% - 20px));display:flex;gap:2px;background:var(--c1);border-radius:30px;padding:7px;z-index:5;box-shadow:0 8px 30px #000}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:22px;color:var(--mut);font-size:11px}
#nav button.on{background:var(--c3);color:var(--tx)}#nav button.on svg{stroke:var(--acc)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.seg{display:flex;background:var(--c1);border-radius:16px;padding:4px}.seg b{padding:10px 18px;border-radius:12px;color:var(--mut);transition:background .15s}.seg b.on{background:var(--c3);color:var(--tx)}
.shop{margin-left:auto;background:linear-gradient(135deg,#ffd84a,#f0a800);color:#2a1d00;padding:10px 16px;border-radius:99px;font-weight:800;box-shadow:0 0 22px #ffc92855}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:99px;background:var(--c1);color:var(--mut)}
.chip.on{background:#fff;color:#000}.chip s{width:11px;height:11px;border-radius:50%}
.card{background:var(--c1);border-radius:18px;padding:12px;margin-bottom:10px}
.card h3{font-size:16px}.mut{color:var(--mut);font-weight:600;font-size:14px}
.price{font-size:20px;color:var(--mut)}
.stage{position:relative;text-align:center;padding:14px 12px 12px;border-radius:22px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 28%,transparent),transparent 65%),var(--c1);border:2px solid color-mix(in srgb,var(--c) 70%,transparent);margin-bottom:10px;min-height:170px;overflow:hidden}
.stage .big{font-size:60px;line-height:1;display:block;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.stage h2{font-size:20px;margin-top:6px}.stage .t{color:var(--c);font-size:14px;margin-top:2px}
.stage p{color:var(--mut);font-weight:600;margin-top:10px;font-size:14px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.reel{position:relative;overflow:hidden;margin:6px -14px 0;padding:14px 0}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--acc);z-index:2;box-shadow:0 0 14px var(--acc)}
.strip{display:flex;gap:8px;will-change:transform}
.it{flex:0 0 96px;height:130px;border-radius:16px;background:var(--c2);border-bottom:4px solid var(--c);padding:7px 5px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.it i{font-style:normal;font-size:34px}.it b{font-size:12px;line-height:1.15}.it s{text-decoration:none;font-size:12px;color:var(--c)}
.ph{position:relative;display:grid;place-items:center;width:100%;height:56px;overflow:hidden;border-radius:10px}
.ph i{font-style:normal;font-size:32px;line-height:1}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 7px #000a)}
.ph.phbig{height:96px}.ph.phbig i{font-size:60px;line-height:1;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.ph.sm{height:36px;width:48px;border-radius:9px}.ph.sm i{font-size:22px}
.cta{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(transparent,#000 35%)}
.go{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:15px;border-radius:20px;background:linear-gradient(180deg,#46e675,#27c556);color:#04210d;font-size:17px;font-weight:800;box-shadow:0 0 30px #30d85f44}
.go em{font-style:normal;background:#04210d26;padding:6px 11px;border-radius:99px;font-size:14px}
.go:disabled{opacity:.55}
.btns{display:flex;gap:8px;justify-content:center;margin-top:14px}
.b2{background:var(--c3);padding:10px 18px;border-radius:99px}.b2.g{background:var(--gold);color:#2a1d00}
.modes{display:flex;gap:8px;margin-bottom:10px}.modes .chip{flex:1;justify-content:center}
h1{font-size:20px;margin:8px 4px 12px}
.list>div{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--c2)}.list>div:last-child{border:0}
.list .e{font-size:30px}.list .n{flex:1}.list .n small{display:block;color:var(--mut);font-weight:600}
.btn{display:block;width:100%;padding:12px;border-radius:14px;background:var(--c2);text-align:center;margin-top:8px}
.btn.g{background:var(--acc);color:#04210d}.btn.y{background:var(--gold);color:#2a1d00}
.mini{background:var(--c3);padding:9px 14px;border-radius:99px;font-size:14px}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}.empty i{font-style:normal;font-size:64px;display:block;margin-bottom:12px;opacity:.7}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:conic-gradient(var(--acc) var(--p),var(--c3) 0)}.ring b{width:52px;height:52px;border-radius:50%;background:var(--c1);display:grid;place-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--c1);border-radius:20px;padding:10px 4px;font-size:12px}
.tile span{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px}
.shopc{position:relative;border-radius:26px;padding:20px;background:linear-gradient(135deg,#ffd13f,#ff9f0a 60%,#ff7a35);color:#2a1700;margin:4px 0 14px;box-shadow:0 0 40px #ff9f0a44}
.shopc h2{font-size:22px}.shopc p{font-weight:700;margin:6px 0 12px;max-width:62%}
.shopc .tags{display:flex;flex-wrap:wrap;gap:8px}.shopc .tags span{background:#fff6;padding:9px 13px;border-radius:99px}
.shopc .open{position:absolute;right:18px;top:24px;background:#2a1700;color:#ffd13f;padding:14px 20px;border-radius:99px}
.sec{color:var(--mut);font-size:14px;margin:18px 4px 8px}
.ov{position:fixed;inset:0;background:#000a;z-index:20;animation:fade .2s}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);max-height:86%;overflow-y:auto;background:var(--c1);border-radius:30px 30px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));z-index:21;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet:before{content:"";display:block;width:56px;height:5px;border-radius:9px;background:var(--c3);margin:0 auto 14px}
.sheet h2{text-align:center;font-size:20px}.sheet .sub{text-align:center;color:var(--mut);font-weight:600;margin:6px 0 14px}
@keyframes up{from{transform:translate(-50%,100%)}}@keyframes fade{from{opacity:0}}
.rv{animation:pop .4s both}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--c3);padding:12px 18px;border-radius:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;text-align:center;max-width:90%}
#toast.on{opacity:1}
.inp{display:block;width:100%;background:var(--c2);border:0;border-radius:14px;padding:15px;color:#fff;font:inherit;margin-top:8px;min-width:0}.row .btn{flex:1}.row .inp{flex:1}
.stage{box-shadow:0 0 26px color-mix(in srgb,var(--c) 30%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 10%,transparent)}
.stage.hi{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 44px color-mix(in srgb,var(--c) 65%,transparent),inset 0 0 40px color-mix(in srgb,var(--c) 18%,transparent)}}
.rainbow{background:linear-gradient(90deg,#22e1ff,#ff3df0,#ffd23f,#22e1ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 3s linear infinite}
@keyframes rb{to{background-position:300% 0}}
.it{box-shadow:0 0 14px color-mix(in srgb,var(--c) 28%,transparent)}
.pill.on{box-shadow:0 0 14px #30d85f66;color:var(--acc)}
.chip.on{box-shadow:0 0 14px #ffffff44}
.news{display:block;width:100%;text-align:left;background:linear-gradient(135deg,#2a2a31,#1c1c20);border-radius:16px;padding:10px 14px;margin:8px 0;border:1px solid #ffffff14}.news b{display:block}.news small{color:var(--mut);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#ff453a;box-shadow:0 0 8px #ff453a;flex:none}
textarea.inp{min-height:90px;resize:vertical}
.nitem{padding:12px 0;border-bottom:1px solid var(--c2)}.nitem p{white-space:pre-wrap;color:#d6d6dc;font-weight:600;margin-top:6px}.nitem small{color:var(--mut)}

.fhero h2{font-size:23px}.fhero p{font-weight:700;margin:6px 0 14px;max-width:88%}
.fhero .fbtn{background:#03210f;color:#7df3a8;padding:13px 22px;border-radius:99px;font-weight:800}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;flex:none;color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* Апгрейдер */
.upgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 10px}
.upcar{background:var(--c1);border-radius:18px;padding:12px;text-align:center;border:2px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--c) 25%,transparent)}
.upcar h4{font-size:14px;margin:8px 0 2px;line-height:1.2}
.upcar .pv{color:var(--mut);font-size:13px}
.upw{position:relative;width:238px;height:238px;margin:10px auto}
.uprot{position:absolute;inset:0;border-radius:50%;will-change:transform}
.upwave{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--c3) 0);-webkit-mask:radial-gradient(circle,transparent 58%,#000 59%);mask:radial-gradient(circle,transparent 58%,#000 59%)}
.updisc{position:absolute;inset:28px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#26262b,#17171a);display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 40px #000}
.updisc b{font-size:34px}.updisc small{color:var(--mut);display:block;font-size:12px}
.uptr{position:absolute;left:4px;top:50%;width:0;height:0;border:9px solid transparent;border-left:18px solid #ffd84a;transform:translateY(-50%);filter:drop-shadow(0 0 8px rgba(255,200,40,.45));z-index:3}
.uppick .list>div{cursor:pointer}
.demo{background:var(--c1);border-radius:14px;padding:8px 12px;font-size:12px;color:var(--mut);text-align:center;margin-bottom:8px}
</style>
</head>

 <button class="card row sp" style="width:100%;text-align:left" data-a="work"><div><h3>🔨 Подработка</h3><div class="mut">${w>0?'ещё '+Math.ceil(w)+' с':fmt(Math.round(150*(1+0.3*(lv-1))))+'–'+fmt(Math.round(400*(1+0.3*(lv-1))))+', раз в минуту'}</div></div></button>
 <div class="sec">АККАУНТ</div>
 <div class="card list"><div><div class="n">Лучший дроп<small>${S.best?fmt(S.best):'—'}</small></div></div><div><div class="n">Машин в гараже<small>${S.cars.length} шт. на ${fmt(sum(S.cars))}</small></div></div></div>`}
function upV(){const u=V.up,ch=(UPGC.find(x=>x[0]==u.m)||[])[1]||50;
 if(u.res&&!u.anim)return resH();
 if(!u.car)return`<div class="empty" style="padding:26px 16px 8px"><i>⚡</i><h1 style="margin:2px 0 8px">Апгрейдер</h1><div class="mut">Поставь машину из гаража и попытайся умножить её ×2, ×5 или ×10. Не повезло — машина сгорает.</div></div>`+pickH();
 const nv=u.car.v*u.m,t=tierF(nv),cs=CARS[t],tgt=cs[(u.car.id*7+u.m*13)%cs.length];
 return`<div class="upgrid">
 <div class="upcar" ${col(u.car.t)}>${phH(u.car.n,u.car.t)}<h4>${esc(u.car.n)}</h4><div class="pv">${fmt(u.car.v)}</div><button class="mini" style="margin-top:8px" data-a="upreset">Заменить</button></div>
 <div class="upcar" ${col(t)}>${phH(tgt[0],t)}<h4 style="color:${T[t].c}">${esc(tgt[0])}</h4><div class="pv">${fmt(nv)}</div><span class="mut" style="font-size:11px">если повезёт</span></div></div>
 <div class="upw" style="--p:${ch}"><div class="upwave"></div><div class="uprot" id="uprot" style="transform:rotate(${u.res&&!u.anim?u.ang:(u.angPrev||0)}deg)"><div class="uptr"></div></div><div class="updisc"><div><b>${ch}%</b><small>шанс</small></div></div></div>
 <div class="modes">${UPGC.map(x=>`<button class="chip ${u.m==x[0]?'on':''}" data-a="upm" data-m="${x[0]}">×${x[0]} · ${x[1]}%</button>`).join('')}</div>
 <div class="cta"><button class="go" data-a="upgo" ${u.busy?'disabled':''}>⚡ Апгрейд ×${u.m}<em>${fmt(u.car.v)} → ${fmt(nv)}</em></button></div>`}
function pickH(){const cs=[...S.cars].sort((a,b)=>b.v-a.v).slice(0,80);
 return'<div class="sec" style="margin-top:14px">ВЫБЕРИ МАШИНУ ИЗ ГАРАЖА</div>'+(cs.length?`<div class="card list uppick">${cs.map(c=>`<button style="display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--c2);text-align:left" data-a="upcar" data-id="${c.id}">${phH(c.n,c.t,'sm')}<div class="n" style="color:${T[c.t].c};flex:1">${esc(c.n)}<small>${fmt(c.v)}</small></div><b class="mut">›</b></button>`).join('')}</div>`:'<div class="empty"><i>🅿️</i>В гараже пусто — сначала открой кейс.</div>')}
function resH(){const u=V.up,r=u.res;
 if(r.win)return`<div class="stage hi" ${col(r.t)}><span class="ph phbig"><i>${T[r.t].e}</i>${PH[r.n]?`<img src="${PH[r.n]}" alt="" onerror="this.remove()">`:''}</span><h2 class="rv">${esc(r.n)}</h2><div class="t" style="color:${T[r.t].c}">${T[r.t].n} · ${fmt(r.v)}</div><p>⚡ Апгрейд удался!</p></div><div class="btns"><button class="b2 g" data-a="upagain">Крутить дальше</button><button class="b2" data-a="upreset">Другая машина</button></div>`;
 return`<div class="stage" style="--c:#ff453a"><span class="big">💥</span><h2>Не повезло</h2><p>Машина${r.v?' за '+fmt(r.v):''} сгорела в апгрейде</p></div><div class="btns"><button class="b2 g" data-a="upreset">Выбрать другую</button></div>`}
async function upgo(){const u=V.up;if(!u||u.busy||!u.car)return;const ch=(UPGC.find(x=>x[0]==u.m)||[])[1]||50;
 u.busy=true;u.anim=true;render();
 let res;
 if(DEMO){const old=u.car,win=Math.random()*100<ch;
  if(win){const nv=old.v*u.m,t=tierF(nv),cs=CARS[t],c=cs[(old.id*7+u.m*13)%cs.length];res={win:true,id:++demoId,n:c[0],t,v:nv};S.cars=S.cars.filter(x=>x.id!=old.id).concat([{id:res.id,n:res.n,t,v:nv}])}
  else{res={win:false,v:old.v};S.cars=S.cars.filter(x=>x.id!=old.id)}}
 else{const j=await api('upgrade',{carId:u.car.id,m:u.m});if(!j){u.busy=false;render();return}res=j.up}
 const arc=ch*3.6,pad=18,ang=win0(res,arc,pad);
 u.angPrev=u.ang||0;u.ang=u.angPrev-Math.floor(u.angPrev/360)*360+6*360+ang;u.res=res;u.busy=false;
 render();const nd=$('#uprot');
 if(nd){nd.style.transition='none';nd.getBoundingClientRect();nd.style.transition='transform 2.2s cubic-bezier(.12,.72,.12,1)';nd.style.transform=`rotate(${u.ang}deg)`}
 hap();await wait(2450);u.anim=false;hap('heavy');render()}
function win0(res,arc,pad){return res.win?90+pad+Math.random()*Math.max(1,arc-2*pad):90+arc+pad+Math.random()*Math.max(1,360-arc-2*pad)}

function sheetV(){const s=V.sheet;
 if(s.t=='list'){const c=s.car,min=Math.ceil(c.v*0.5),max=c.v*5;return`<h2>${T[c.t].e} ${esc(c.n)}</h2><div class="sub">Ценность ${fmt(c.v)} · цена от ${fmt(min)} до ${fmt(max)}<br>Комиссия рынка 5% с продажи</div><input class="inp" id="l_price" inputmode="numeric" placeholder="Цена, ₽" value="${Math.round(c.v*1.5)}"><button class="btn g" data-a="listgo" data-id="${c.id}">Выставить на рынок</button><button class="btn" data-a="close">Отмена</button>`}
 if(s.t=='news')return`<h2>📰 Новости</h2><div class="sub">Обновления игры</div>${V.news.length?V.news.map(n=>`<div class="nitem"><b>${esc(n.title)}</b> ${S.admin?`<button class="mini" data-a="newsdel" data-id="${n.id}">🗑</button>`:''}<br><small>${new Date(n.ts).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</small><p>${esc(n.body)}</p></div>`).join(''):'<div class="sub">Пока новостей нет</div>'}${S.admin?`<input class="inp" id="n_title" placeholder="Заголовок" maxlength="80"><textarea class="inp" id="n_body" placeholder="Текст новости" maxlength="1000"></textarea><button class="btn y" data-a="newsadd">Опубликовать</button>`:''}<button class="btn g" data-a="close">Закрыть</button>`;
 if(s.t=='shop')return`<h2>⭐ Магазин</h2><div class="sub">Оплата звёздами Telegram</div><div class="card list">${s.items.map(i=>`<div><div class="n">${i.title}<small>${i.desc}</small></div><button class="mini" data-a="buy" data-i="${i.id}">${i.stars} ⭐</button></div>`).join('')}</div><button class="btn g" data-a="close">Закрыть</button>`;
 if(s.t=='top')return`<h2>🏆 Рейтинг</h2><div class="sub">Деньги и машины</div><div class="card list">${s.rows.map((r,i)=>`<div style="${r.me?'color:var(--acc)':''}"><div class="n">${i+1}. ${r.n.replace(/</g,'&lt;')}${r.id?`<small>ID ${r.id}</small>`:''}</div><b>${short(r.v)}</b></div>`).join('')}</div><button class="btn g" data-a="close">Закрыть</button>`;
 if(s.t=='promo')return`<h2>🎟 Промокод</h2><div class="sub">Введи код, чтобы получить награду</div><input class="inp" id="p_code" placeholder="Код" autocapitalize="characters"><button class="btn g" data-a="promoGo">Применить</button>`;
 if(s.t=='adm')return`<h2>🛠 Админка</h2><div class="sub">ID игрока виден в рейтинге</div><input class="inp" id="a_id" inputmode="numeric" placeholder="ID игрока"><input class="inp" id="a_amt" inputmode="numeric" placeholder="Сумма ₽ (с минусом — забрать)"><div class="row"><button class="btn g" data-a="adm" data-op="bal">Выдать ₽</button><button class="btn" data-a="adm" data-op="luck">Выдать удачу (×, часы)</button></div><div class="row"><button class="btn" data-a="adm" data-op="ban1">Бан</button><button class="btn" data-a="adm" data-op="ban0">Разбан</button></div><input class="inp" id="a_code" placeholder="Промокод (например START)"><div class="row"><input class="inp" id="a_pamt" inputmode="numeric" placeholder="Сумма ₽"><input class="inp" id="a_uses" inputmode="numeric" placeholder="Раз"></div><div class="row"><input class="inp" id="a_pluck" inputmode="decimal" placeholder="Удача × (напр. 3.5)"><input class="inp" id="a_phours" inputmode="decimal" placeholder="Часов"></div><button class="btn y" data-a="adm" data-op="promo">Создать промокод</button><button class="btn" data-a="adm" data-op="stats">Статистика</button>`;
 const b=s.drops,best=b.reduce((m,d)=>d.v>m.v?d:m,b[0]),tot=sum(b),df=tot-s.cost;
 return`<h2>${b.length} открытий</h2><div class="sub">Лучший: <span style="color:${T[best.t].c}">${T[best.t].n.toLowerCase()}</span> · ${fmt(best.v)}</div><div class="card list">${b.map((d,k)=>`<div class="rv" style="animation-delay:${k*.14}s">${phH(d.n,d.t,'sm')}<div class="n" style="color:${T[d.t].c}">${d.n}<small>${T[d.t].n}</small></div><b>${fmt(d.v)}</b></div>`).join('')}</div><div class="sub">Всего ${fmt(tot)} за ${fmt(s.cost)} · <span style="color:${df>=0?'var(--acc)':'#ff6b6b'}">${df>=0?'+':'−'}${fmt(Math.abs(df))}</span></div><button class="btn y" data-a="sellb">Продать все за ${fmt(tot)}</button><button class="btn g" data-a="close">Отлично</button>`}
function ask(m,f){if(tg&&tg.showConfirm)tg.showConfirm(m,ok=>ok&&f());else if(confirm(m))f()}

async function spin(){if(V.busy||V.wait)return;const c=CASES[V.cs],n=V.n,cost=c.p*n;
 if(S.bal<cost){toast('Не хватает денег. Нужно '+fmt(cost));hap('heavy');return}
 V.wait=true;const j=await api('open',{ci:V.cs,n});V.wait=false;if(!j)return;
 const ds=j.drops,best=ds.reduce((m,d)=>d.v>m.v?d:m,ds[0]);
 V.busy=true;V.drop=null;V.strip=null;
 if(n==1){V.strip=[];for(let k=0;k<40;k++)V.strip.push(k==34?ds[0]:roll(V.cs))}
 render();hap();
 if(n==1){const st=$('#strip'),off=34*104+48-st.parentElement.clientWidth/2+(Math.random()*60-30);st.style.transition='none';st.style.transform='translateX(0)';st.getBoundingClientRect();st.style.transition='transform 3.4s cubic-bezier(.12,.7,.1,1)';st.style.transform=`translateX(${-off}px)`}
 await wait(n==1?3700:1200);
 V.busy=false;V.drop=best;if(n>1)V.sheet={t:'batch',drops:ds,cost};render();hap('heavy')}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;
 if(V.busy&&a!='close')return;
 if(a=='tab'){V.tab=D.t;V.sheet=null;if(D.t=='market'){render();await loadMk()}else if(D.t=='friends'){V.fr=null;render();await loadFr();render()}}
 else if(a=='us'){V.us=D.s;V.up.res=null}
 else if(a=='upcar'){const c=S.cars.find(x=>x.id==+D.id);if(c){V.up.car=c;V.up.res=null;hap()}}
 else if(a=='upm'){V.up.m=UPGC.some(x=>x[0]==+D.m)?+D.m:V.up.m;V.up.res=null;V.up.angPrev=V.up.ang}
 else if(a=='upreset'){V.up.car=null;V.up.res=null}
 else if(a=='upagain'){const r=V.up.res;V.up.car=r.win?{id:r.id,n:r.n,t:r.t,v:r.v}:null;V.up.res=null}
 else if(a=='upgo'){upgo();return}
 else if(a=='cs')V.cs=+D.i;
 else if(a=='mode')V.n=+D.n;
 else if(a=='spin'){spin();return}
 else if(a=='close')V.sheet=null;
 else if(a=='sheet'&&D.s=='news'){const j=await api('news');if(j)V.news=j.news;markSeen();V.sheet={t:'news'}}
 else if(a=='newsadd'){const v=id=>($('#'+id)||{}).value||'';const j=await api('adm',{op:'news_add',title:v('n_title'),body:v('n_body')});if(!j)return;const n=await api('news');if(n)V.news=n.news;markSeen();toast('Новость опубликована')}
 else if(a=='newsdel'){const j=await api('adm',{op:'news_del',id:D.id});if(!j)return;const n=await api('news');if(n)V.news=n.news;markSeen();toast('Удалено')}
 else if(a=='sheet'){if(D.s=='shop'){const j=await api('shop');if(!j)return;V.sheet={t:'shop',items:j.items}}else V.sheet={t:D.s}}
 else if(a=='mksub'){V.mk.sub=D.s;render();await loadMk()}
 else if(a=='mkt'){V.mk.tier=+D.t;await loadMk()}
 else if(a=='mks'){V.mk.sort=D.k;await loadMk()}
 else if(a=='mkq'){V.mk.q=($('#mk_q')||{}).value||'';await loadMk()}
 else if(a=='mkbuy'){const l=V.mk.lots.find(x=>x.id==D.id);if(!l)return;ask('Купить '+l.c+' за '+fmt(l.p)+'?',async()=>{const j=await api('buy',{id:+D.id});if(j){toast('✅ Куплено: '+j.bought);hap('medium')}await loadMk();render()});return}
 else if(a=='mkcancel'){const j=await api('cancel',{id:+D.id});if(j)toast('Машина вернулась в гараж');await loadMk()}
 else if(a=='listsheet'){const c=S.cars.find(x=>x.n==D.n);if(c)V.sheet={t:'list',car:c}}
 else if(a=='listgo'){const j=await api('list',{carId:+D.id,price:($('#l_price')||{}).value});if(!j)return;V.sheet=null;toast('Выставлено на рынок')}
 else if(a=='top'){const j=await api('top');if(!j)return;V.sheet={t:'top',rows:j.top}}
 else if(a=='buy'){const j=await api('invoice',{item:D.i});if(j&&tg&&tg.openInvoice)tg.openInvoice(j.url,async st=>{if(st=='paid'){toast('✅ Оплачено!');await api('state');render()}});return}
 else if(a=='promoGo'){const j=await api('promo',{code:($('#p_code')||{}).value||''});if(!j)return;toast('🎁 +'+fmt(j.gain)+(j.luck>1?' и удача '+j.luck+'× на '+j.hours+' ч':''));V.sheet=null}
 else if(a=='refshare'){const l=refLink();if(!l){toast('Ссылка появится после загрузки профиля');return}const u='https://t.me/share/url?url='+encodeURIComponent(l)+'&text='+encodeURIComponent('Залетай в Автокейс — крутим кейсы с тачками!');if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else toast(l)}
 else if(a=='refcopy'){const l=refLink();if(!l)return;try{navigator.clipboard.writeText(l).then(()=>toast('Ссылка скопирована'),()=>toast(l))}catch(e){toast(l)}}
 else if(a=='refclaim'){const j=await api('refclaim',{i:+D.i});if(!j)return;toast('🎁 '+j.label);hap('medium');V.fr=null;render();await loadFr()}
 else if(a=='adm'){const v=id=>($('#'+id)||{}).value||'';let body={op:D.op,target:v('a_id'),amount:v('a_amt')};
  if(D.op=='luck'){body.mult=parseFloat((v('a_pluck')||'10').replace(',','.'));body.hours=parseFloat((v('a_phours')||'2').replace(',','.'))}
  if(D.op=='ban1'||D.op=='ban0'){body.op='ban';body.on=D.op=='ban1'}
  if(D.op=='promo')body={op:'promo',code:v('a_code'),amount:v('a_pamt'),uses:v('a_uses'),luck:v('a_pluck'),hours:v('a_phours')};
  const j=await api('adm',body);if(j)toast(j.stats?`Игроков: ${j.stats.n} · денег: ${fmt(j.stats.money)} · кейсов: ${j.stats.opened}`:'Готово');return}
 else if(a=='sell1'){const d=V.drop,j=await api('sell',{ids:[d.id]});if(!j)return;d.sold=true;toast('Продано за '+fmt(j.sum))}
 else if(a=='sellb'){const j=await api('sell',{ids:V.sheet.drops.map(d=>d.id)});if(!j)return;if(V.drop)V.drop.sold=true;V.sheet=null;toast('Продано за '+fmt(j.sum))}
 else if(a=='sellone'){const c=S.cars.find(x=>x.n==D.n);if(!c)return;const j=await api('sell',{ids:[c.id]});if(!j)return;toast('Продано за '+fmt(j.sum))}
 else if(a=='sellt'){const t=+D.t,l=S.cars.filter(c=>c.t==t),go=async()=>{const j=await api('sell',{scope:'t'+t});if(j){toast('Продано за '+fmt(j.sum));render()}};t>=2?ask('Продать все '+T[t].n.toLowerCase()+' машины за '+fmt(sum(l))+'?',go):go();return}
 else if(a=='sella'){ask('Продать ВСЕ машины за '+fmt(sum(S.cars))+'?',async()=>{const j=await api('sell',{scope:'all'});if(j){toast('Продано за '+fmt(j.sum));render()}});return}
 else if(a=='work'){const j=await api('work');if(!j)return;toast('🔨 Заработал '+fmt(j.gain));hap()}
 else if(a=='daily'){const j=await api('daily');if(!j)return;toast('🎁 +'+fmt(j.gain));hap()}
 render()});
render();
if(!(tg&&tg.initData)){DEMO=true;S={ok:true,id:777,bal:150000,opened:7,best:45000,lw:0,ld:0,luck:1,off:0,admin:false,now:Date.now(),cars:[{id:1,n:'Toyota Camry',t:2,v:3000},{id:2,n:'BMW M5',t:3,v:15000},{id:3,n:'Porsche 911',t:3,v:45000},{id:4,n:'Lada Granta',t:0,v:350}]};V.us='up';V.news=[{id:0,title:'Демо',ts:Date.now()}];render()}
else api('state').then(async j=>{if(!j)V.err='Не удалось связаться с сервером. Проверь интернет и открой игру заново.';else{const n=await api('news');if(n)V.news=n.news}render()});
setInterval(()=>{if(S.ok)$('#top').innerHTML=topH()},20000);
setInterval(()=>{if(V.tab=='more'&&!V.busy&&!V.sheet&&S.ok)render()},30000);
</script>
