<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Номерок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#16161a;--card2:#202026;--tx:#f5f5f7;--mut:#8d8d98;--acc:#34d65f;--t0:#9aa0a6;--t1:#3b9cff;--t2:#b45cff;--t3:#ffc928}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:600 16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:auto;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 8px}
header span{color:var(--mut);font-size:14px}
#bal{font-size:26px;font-weight:800;letter-spacing:-.5px}
#main{flex:1;overflow-y:auto;padding:6px 14px 16px}
nav{display:flex;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--card)}
.tab{flex:1;padding:12px 0;border:0;border-radius:14px;background:none;color:var(--mut);font:inherit}
.tab.on{background:var(--card2);color:var(--tx)}
h2{font-size:20px;margin:6px 4px 12px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:10px;border:2px solid transparent}
.case{display:flex;justify-content:space-between;align-items:center;width:100%;color:inherit;font:inherit;text-align:left;border-color:var(--c)}
.case b{font-size:19px}.case small{display:block;color:var(--mut);font-weight:600;margin-top:2px}
.case em{font-style:normal;font-weight:800;color:var(--c)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:800;color:#06210f;background:var(--acc);margin-top:8px}
.btn.alt{background:var(--card2);color:var(--tx)}
.btn.sell{background:#ffd23f;color:#2a2000}
.row{display:flex;gap:8px}.row .btn{flex:1}
.odds div{display:flex;justify-content:space-between;padding:5px 0;color:var(--mut)}
.odds b{color:var(--c)}
.it{flex:0 0 96px;height:112px;border-radius:16px;background:var(--card2);border-bottom:4px solid var(--c);padding:8px 6px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.it i{font-style:normal;font-size:34px}.it b{font-size:12px;line-height:1.15}.it s{text-decoration:none;font-size:12px;color:var(--c)}
.reel{position:relative;overflow:hidden;border-radius:20px;background:var(--card);padding:16px 0;margin:14px 0}
.strip{display:flex;gap:8px;will-change:transform}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--acc);z-index:2;box-shadow:0 0 12px var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.grid .it{flex:none;width:auto}
.rv{animation:rv .35s both}@keyframes rv{from{opacity:0;transform:scale(.7)}}
.big{text-align:center;padding:26px 16px;border:2px solid var(--c);border-radius:22px;background:var(--card);margin:14px 0;animation:rv .4s both}
.big i{font-style:normal;font-size:64px;display:block}.big b{font-size:22px;display:block;margin-top:6px}.big span{color:var(--c);font-size:18px;font-weight:800}
.sum{text-align:center;color:var(--mut);margin:6px 0 4px}
.line{display:flex;justify-content:space-between;padding:6px 2px;color:var(--mut)}.line b{color:var(--tx)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card2);padding:11px 18px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;text-align:center}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.rv,.big{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header><span>Баланс</span><div id="bal"></div></header>
  <div id="main"></div>
  <nav>
    <button class="tab" data-t="cases" data-a="tab">📦 Кейсы</button>
    <button class="tab" data-t="garage" data-a="tab">🚗 Гараж</button>
    <button class="tab" data-t="more" data-a="tab">⭐ Ещё</button>
  </nav>
</div>
<div id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#09090b');tg.setBackgroundColor('#09090b')}catch(e){}}
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('ru-RU').replace(/\u00a0|\u202f/g,' ')+' ₽';
const hap=t=>{try{tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
const T=[{n:'Обычная',c:'#9aa0a6'},{n:'Редкая',c:'#3b9cff'},{n:'Эпическая',c:'#b45cff'},{n:'Легендарная',c:'#ffc928'}];
const CARS=[
[['ВАЗ-2105',150,30],['ВАЗ-2107',200,25],['Daewoo Matiz',180,20],['Lada Kalina',250,15],['Lada Priora',300,7],['Lada Granta',350,3]],
[['Renault Logan',1500,30],['Kia Rio',1800,25],['Hyundai Solaris',2000,20],['Ford Focus',2400,15],['Skoda Octavia',3000,7],['Toyota Corolla',3500,3]],
[['Toyota Camry',8000,30],['BMW 3 Series',10000,25],['Audi A4',12000,20],['Mercedes C-Class',14000,15],['Lexus IS',18000,7],['Subaru WRX STI',25000,3]],
[['BMW M5',80000,30],['Audi RS7',110000,25],['Mercedes G63 AMG',150000,20],['Porsche 911',250000,12],['Lamborghini Huracán',450000,8],['Ferrari F8',700000,4],['Bugatti Chiron',3000000,1]]];
const CASES=[
{n:'Обычный',p:500,o:[91.5,7.6,.87,.03]},
{n:'Редкий',p:2500,o:[43,53,3.6,.4]},
{n:'Эпический',p:12000,o:[0,61,36,3]},
{n:'Легендарный',p:60000,o:[0,0,76,24]}];
const START={bal:5000,cars:[],opened:0,best:0,lw:0,ld:0,id:1};
let S=Object.assign({},START),V={tab:'cases',cs:null,res:null};
try{const j=localStorage.getItem('s');if(j)S=Object.assign({},START,JSON.parse(j))}catch(e){}
function save(){const j=JSON.stringify(S);try{localStorage.setItem('s',j)}catch(e){}try{tg.CloudStorage.setItem('s',j)}catch(e){}}
try{tg.CloudStorage.getItem('s',(e,v)=>{if(!e&&v&&!V.res){try{S=Object.assign({},START,JSON.parse(v));render()}catch(x){}}})}catch(e){}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function wpick(w){let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){if((r-=w[i])<0)return i}return w.length-1}
function roll(ci){const t=wpick(CASES[ci].o),cs=CARS[t],c=cs[wpick(cs.map(x=>x[2]))];return{t,n:c[0],v:c[1]}}
const item=d=>`<div class="it" style="--c:${T[d.t].c}"><i>🚗</i><b>${d.n}</b><s>${fmt(d.v)}</s></div>`;
const sum=a=>a.reduce((s,d)=>s+d.v,0);

function casesView(){return`<h2>Кейсы</h2>`+CASES.map((c,i)=>`<button class="card case" style="--c:${T[i].c}" data-a="case" data-i="${i}"><div><b>${c.n}</b><small>чем дороже, тем круче машины</small></div><em>${fmt(c.p)}</em></button>`).join('')}
function caseView(i){const c=CASES[i];return`<h2>${c.n} кейс · ${fmt(c.p)}</h2><div class="card odds">${c.o.map((o,t)=>o>0?`<div><span>${T[t].n}</span><b style="--c:${T[t].c}">${o}%</b></div>`:'').join('')}</div>
<div class="row"><button class="btn" data-a="open" data-i="${i}" data-n="1">Открыть ×1<br>${fmt(c.p)}</button><button class="btn" data-a="open" data-i="${i}" data-n="5">Открыть ×5<br>${fmt(c.p*5)}</button></div>
<button class="btn alt" data-a="back">Назад</button>`}
function againBtns(i){const c=CASES[i];return`<div class="row"><button class="btn" data-a="open" data-i="${i}" data-n="1">Ещё ×1<br>${fmt(c.p)}</button><button class="btn" data-a="open" data-i="${i}" data-n="5">Ещё ×5<br>${fmt(c.p*5)}</button></div><button class="btn alt" data-a="back">К кейсам</button>`}
function resView(){const r=V.res;if(r.phase=='anim'){return r.n==1?`<div class="reel"><div class="mark"></div><div class="strip" id="strip">${r.strip.map(item).join('')}</div></div><p class="sum">Открываем…</p>`:`<div class="grid">${r.drops.map((d,k)=>`<div class="rv" style="animation-delay:${k*.28}s">${item(d)}</div>`).join('')}</div><p class="sum">Открываем…</p>`}
const tot=sum(r.drops),cost=CASES[r.i].p*r.n,df=tot-cost;
let h=r.n==1?`<div class="big" style="--c:${T[r.drops[0].t].c}"><i>🚗</i><b>${r.drops[0].n}</b><span>${T[r.drops[0].t].n} · ${fmt(r.drops[0].v)}</span></div>`:`<div class="grid">${r.drops.map(item).join('')}</div><div class="line"><span>Стоимость машин</span><b>${fmt(tot)}</b></div><div class="line"><span>Кейсы стоили</span><b>${fmt(cost)}</b></div><div class="line"><span>Итог</span><b style="color:${df>=0?'var(--acc)':'#ff6b6b'}">${df>=0?'+':'−'}${fmt(Math.abs(df))}</b></div>`;
if(!r.sold)h+=`<button class="btn sell" data-a="sell">Продать за ${fmt(tot)}</button>`;else h+=`<p class="sum">✅ Продано за ${fmt(tot)}</p>`;
return h+againBtns(r.i)}
function garageView(){const cs=S.cars;if(!cs.length)return`<h2>Гараж</h2><div class="card sum">Здесь пока пусто. Открой кейс — первая машина будет здесь.</div>`;
const g={};cs.forEach(c=>{const k=c.n;g[k]=g[k]||{...c,k:0};g[k].k++});
const rows=Object.values(g).sort((a,b)=>b.v-a.v).map(c=>`<div class="line"><span style="color:${T[c.t].c}">${c.n} ×${c.k}</span><b>${fmt(c.v*c.k)}</b></div>`).join('');
let b='';for(let t=0;t<4;t++){const a=cs.filter(c=>c.t==t);if(a.length)b+=`<button class="btn alt" data-a="sellt" data-t="${t}">Продать ${T[t].n.toLowerCase()} ×${a.length} · ${fmt(sum(a))}</button>`}
return`<h2>Гараж · ${cs.length} шт. на ${fmt(sum(cs))}</h2><div class="card">${rows}</div>${b}<button class="btn sell" data-a="sella">Продать всё · ${fmt(sum(cs))}</button>`}
function moreView(){const w=Math.max(0,60-(Date.now()-S.lw)/1000),d=Math.max(0,24*3600-(Date.now()-S.ld)/1000);
return`<h2>Ещё</h2><button class="btn" data-a="work">🔨 Подработать${w>0?' · '+Math.ceil(w)+' с':''}</button><button class="btn" data-a="daily">🎁 Ежедневный бонус${d>0?' · '+Math.floor(d/3600)+' ч '+Math.floor(d%3600/60)+' мин':' · '+fmt(1500)}</button>
<div class="card" style="margin-top:14px"><div class="line"><span>Открыто кейсов</span><b>${S.opened}</b></div><div class="line"><span>Машин в гараже</span><b>${S.cars.length}</b></div><div class="line"><span>Лучший дроп</span><b>${S.best?fmt(S.best):'—'}</b></div></div>
<button class="btn alt" data-a="reset">Начать игру заново</button>`}

function render(){$('#bal').textContent=fmt(S.bal);
$('#main').innerHTML=V.res?resView():V.tab=='cases'?(V.cs!=null?caseView(V.cs):casesView()):V.tab=='garage'?garageView():moreView();
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==V.tab&&!V.res))}
function ask(m,f){if(tg&&tg.showConfirm)tg.showConfirm(m,ok=>ok&&f());else if(confirm(m))f()}
function sellList(a){const t=sum(a),ids=new Set(a.map(c=>c.id));S.cars=S.cars.filter(c=>!ids.has(c.id));S.bal+=t;save();hap('medium');return t}

function openCase(i,n){const c=CASES[i],cost=c.p*n;if(S.bal<cost){toast('Не хватает денег.\nНужно '+fmt(cost));hap('heavy');return}
S.bal-=cost;S.opened+=n;const drops=[];for(let k=0;k<n;k++){const d=roll(i);d.id=S.id++;drops.push(d);S.cars.push(d)}
S.best=Math.max(S.best,...drops.map(d=>d.v));save();
const r=V.res={i,n,drops,phase:'anim',sold:false};
if(n==1){r.strip=[];for(let k=0;k<40;k++)r.strip.push(k==34?drops[0]:roll(i))}
render();hap();
if(n==1){const s=$('#strip'),w=104,off=34*w+48-s.parentElement.clientWidth/2+(Math.random()*60-30);
s.style.transition='none';s.style.transform='translateX(0)';s.getBoundingClientRect();
s.style.transition='transform 3.6s cubic-bezier(.12,.7,.1,1)';s.style.transform=`translateX(${-off}px)`}
setTimeout(()=>{if(V.res===r){r.phase='done';render();hap('heavy')}},n==1?3900:2100)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;
if(V.res&&V.res.phase=='anim')return;
if(a=='tab'){V.tab=D.t;V.cs=null;V.res=null}
else if(a=='case')V.cs=+D.i;
else if(a=='back'){V.cs=null;V.res=null;V.tab='cases'}
else if(a=='open'){V.cs=null;openCase(+D.i,+D.n);return}
else if(a=='sell'){const r=V.res,ids=new Set(r.drops.map(d=>d.id)),t=sellList(S.cars.filter(c=>ids.has(c.id)));r.sold=true;toast('Продано за '+fmt(t))}
else if(a=='sellt'){const t=+D.t,l=S.cars.filter(c=>c.t==t);const go=()=>{toast('Продано за '+fmt(sellList(l)));render()};t>=2?ask('Продать все '+T[t].n.toLowerCase()+' машины за '+fmt(sum(l))+'?',go):go()}
else if(a=='sella'){ask('Продать ВСЕ машины за '+fmt(sum(S.cars))+'?',()=>{toast('Продано за '+fmt(sellList(S.cars.slice())));render()})}
else if(a=='work'){if(Date.now()-S.lw<60000){toast('Ты устал, подожди немного');hap('heavy')}else{const p=150+Math.floor(Math.random()*251);S.bal+=p;S.lw=Date.now();save();toast('🔨 Заработал '+fmt(p));hap()}}
else if(a=='daily'){if(Date.now()-S.ld<864e5){toast('Бонус уже забран')}else{S.bal+=1500;S.ld=Date.now();save();toast('🎁 +'+fmt(1500));hap()}}
else if(a=='reset'){ask('Удалить весь прогресс и начать с 5 000 ₽?',()=>{S=Object.assign({},START);save();V={tab:'cases',cs:null,res:null};render()});return}
render()});
render();setInterval(()=>{if(V.tab=='more'&&!V.res)render()},30000);
</script>
</body>
</html>
