<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Автокейс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#000;--c1:#17171a;--c2:#232327;--c3:#2e2e33;--tx:#fff;--mut:#8e8e98;--acc:#30d85f;--gold:#ffc928}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:700 16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:auto;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.pill{display:flex;align-items:center;gap:8px;background:var(--c1);border-radius:99px;padding:11px 16px;font-size:15px}
.lvl i{width:46px;height:6px;border-radius:9px;background:var(--c3);overflow:hidden}.lvl u{display:block;height:100%;background:var(--acc);border-radius:9px}
.bal{margin-left:auto;text-align:right}.bal small{display:block;color:var(--mut);font-size:12px}.bal b{font-size:21px;letter-spacing:-.4px}
#main{flex:1;overflow-y:auto;padding:4px 14px 120px;-webkit-overflow-scrolling:touch}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(492px,calc(100% - 20px));display:flex;gap:2px;background:var(--c1);border-radius:30px;padding:7px;z-index:5;box-shadow:0 8px 30px #000}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:24px;color:var(--mut);font-size:12px}
#nav button.on{background:var(--c3);color:var(--tx)}#nav button.on svg{stroke:var(--acc)}
svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.seg{display:flex;background:var(--c1);border-radius:16px;padding:4px}.seg b{padding:10px 18px;border-radius:12px;background:var(--c3)}
.shop{margin-left:auto;background:linear-gradient(135deg,#ffd84a,#f0a800);color:#2a1d00;padding:13px 20px;border-radius:99px;font-weight:800;box-shadow:0 0 22px #ffc92855}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:99px;background:var(--c1);color:var(--mut)}
.chip.on{background:#fff;color:#000}.chip s{width:11px;height:11px;border-radius:50%}
.card{background:var(--c1);border-radius:22px;padding:16px;margin-bottom:10px}
.card h3{font-size:20px}.mut{color:var(--mut);font-weight:600;font-size:14px}
.price{font-size:26px;color:var(--mut)}
.stage{position:relative;text-align:center;padding:22px 14px 18px;border-radius:26px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 28%,transparent),transparent 65%),var(--c1);border:2px solid color-mix(in srgb,var(--c) 70%,transparent);margin-bottom:10px;min-height:230px;overflow:hidden}
.stage .big{font-size:84px;line-height:1;display:block;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.stage h2{font-size:26px;margin-top:6px}.stage .t{color:var(--c);font-size:17px;margin-top:2px}
.stage p{color:var(--mut);font-weight:600;margin-top:10px;font-size:14px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.reel{position:relative;overflow:hidden;margin:6px -14px 0;padding:14px 0}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--acc);z-index:2;box-shadow:0 0 14px var(--acc)}
.strip{display:flex;gap:8px;will-change:transform}
.it{flex:0 0 96px;height:112px;border-radius:16px;background:var(--c2);border-bottom:4px solid var(--c);padding:8px 5px;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
.it i{font-style:normal;font-size:34px}.it b{font-size:12px;line-height:1.15}.it s{text-decoration:none;font-size:12px;color:var(--c)}
.cta{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(transparent,#000 35%)}
.go{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:20px;border-radius:26px;background:linear-gradient(180deg,#46e675,#27c556);color:#04210d;font-size:20px;font-weight:800;box-shadow:0 0 30px #30d85f44}
.go em{font-style:normal;background:#04210d26;padding:8px 14px;border-radius:99px;font-size:16px}
.go:disabled{opacity:.55}
.btns{display:flex;gap:8px;justify-content:center;margin-top:14px}
.b2{background:var(--c3);padding:13px 22px;border-radius:99px}.b2.g{background:var(--gold);color:#2a1d00}
.modes{display:flex;gap:8px;margin-bottom:10px}.modes .chip{flex:1;justify-content:center}
h1{font-size:24px;margin:8px 4px 12px}
.list>div{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--c2)}.list>div:last-child{border:0}
.list .e{font-size:30px}.list .n{flex:1}.list .n small{display:block;color:var(--mut);font-weight:600}
.btn{display:block;width:100%;padding:16px;border-radius:18px;background:var(--c2);text-align:center;margin-top:8px}
.btn.g{background:var(--acc);color:#04210d}.btn.y{background:var(--gold);color:#2a1d00}
.mini{background:var(--c3);padding:9px 14px;border-radius:99px;font-size:14px}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}.empty i{font-style:normal;font-size:64px;display:block;margin-bottom:12px;opacity:.7}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:conic-gradient(var(--acc) var(--p),var(--c3) 0)}.ring b{width:68px;height:68px;border-radius:50%;background:var(--c1);display:grid;place-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--c1);border-radius:20px;padding:14px 4px;font-size:13px}
.tile span{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px}
.shopc{position:relative;border-radius:26px;padding:20px;background:linear-gradient(135deg,#ffd13f,#ff9f0a 60%,#ff7a35);color:#2a1700;margin:4px 0 14px;box-shadow:0 0 40px #ff9f0a44}
.shopc h2{font-size:28px}.shopc p{font-weight:700;margin:6px 0 12px;max-width:62%}
.shopc .tags{display:flex;flex-wrap:wrap;gap:8px}.shopc .tags span{background:#fff6;padding:9px 13px;border-radius:99px}
.shopc .open{position:absolute;right:18px;top:24px;background:#2a1700;color:#ffd13f;padding:14px 20px;border-radius:99px}
.sec{color:var(--mut);font-size:14px;margin:18px 4px 8px}
.ov{position:fixed;inset:0;background:#000a;z-index:20;animation:fade .2s}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);max-height:86%;overflow-y:auto;background:var(--c1);border-radius:30px 30px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));z-index:21;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet:before{content:"";display:block;width:56px;height:5px;border-radius:9px;background:var(--c3);margin:0 auto 14px}
.sheet h2{text-align:center;font-size:24px}.sheet .sub{text-align:center;color:var(--mut);font-weight:600;margin:6px 0 14px}
@keyframes up{from{transform:translate(-50%,100%)}}@keyframes fade{from{opacity:0}}
.rv{animation:pop .4s both}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--c3);padding:12px 18px;border-radius:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;text-align:center;max-width:90%}
#toast.on{opacity:1}
.inp{display:block;width:100%;background:var(--c2);border:0;border-radius:14px;padding:15px;color:#fff;font:inherit;margin-top:8px;min-width:0}.row .btn{flex:1}.row .inp{flex:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"><div id="top"></div><div id="main"></div></div>
<div id="nav"></div><div id="layer"></div><div id="toast"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000')}catch(e){}}
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('ru-RU').replace(/\u00a0|\u202f/g,' ')+' ₽';
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' млн ₽':fmt(n);
const hap=t=>{try{tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const T=[{n:'Обычная',c:'#9aa0a6',e:'🚗'},{n:'Редкая',c:'#3b9cff',e:'🚙'},{n:'Эпическая',c:'#b45cff',e:'🚘'},{n:'Легендарная',c:'#ffc928',e:'🏎️'}];
const CARS=[
[['ВАЗ-2105',150,30],['ВАЗ-2107',200,25],['Daewoo Matiz',180,20],['Lada Kalina',250,15],['Lada Priora',300,7],['Lada Granta',350,3]],
[['Renault Logan',700,30],['Kia Rio',800,25],['Hyundai Solaris',900,20],['Ford Focus',1100,15],['Skoda Octavia',1400,7],['Toyota Corolla',1800,3]],
[['Toyota Camry',3000,30],['BMW 3 Series',3800,25],['Audi A4',4500,20],['Mercedes C-Class',5500,15],['Lexus IS',7000,7],['Subaru WRX STI',10000,3]],
[['BMW M5',15000,30],['Audi RS7',20000,25],['Mercedes G63 AMG',28000,20],['Porsche 911',45000,12],['Lamborghini Huracán',80000,8],['Ferrari F8',150000,4],['Bugatti Chiron',500000,1]]];
const CASES=[
{n:'Обычный',p:1000,o:[72, 20, 7, 1]},
{n:'Редкий',p:3000,o:[36, 40, 19, 5]},
{n:'Эпический',p:9000,o:[8, 30, 44, 18]},
{n:'Легендарный',p:25000,o:[0, 10, 30, 60]}];
const API='https://autocase-api.ahmedovalimagomed1.workers.dev/api';
let S={ok:false,bal:0,cars:[],opened:0,best:0,lw:0,ld:0,luck:1,off:0,admin:false},V={tab:'play',cs:0,n:1,drop:null,busy:false,wait:false,sheet:null,strip:null,err:''};
const now=()=>Date.now()+(S.off||0);
function applyState(j){S={...S,...j,off:j.now-Date.now(),ok:true};delete S.drops;if(V.drop&&!V.drop.sold&&!S.cars.some(x=>x.id==V.drop.id))V.drop.sold=true}
async function api(a,extra){try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-init':tg?tg.initData:''},body:JSON.stringify({a,...(extra||{})})});const j=await r.json();if(!j.ok){toast(j.m||'Ошибка');hap('heavy');return null}if(j.cars)applyState(j);return j}catch(e){toast('Нет связи с сервером');return null}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1900)}
function wpick(w){let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){if((r-=w[i])<0)return i}return w.length-1}
function roll(ci){const t=wpick(CASES[ci].o),cs=CARS[t],c=cs[wpick(cs.map(x=>x[2]))];return{t,n:c[0],v:c[1]}}
const sum=a=>a.reduce((s,d)=>s+d.v,0);
const col=t=>`style="--c:${T[t].c}"`;
const item=d=>`<div class="it" ${col(d.t)}><i>${T[d.t].e}</i><b>${d.n}</b><s>${fmt(d.v)}</s></div>`;
const IC={play:'<path d="M7 4.5l13 7.5-13 7.5z"/>',garage:'<path d="M3 10.5L12 3l9 7.5V21H3z"/><path d="M8 21v-7h8v7"/>',market:'<path d="M4 9l1.6-5h12.8L20 9M4 9v11h16V9M4 9h16M9.5 20v-6h5v6"/>',friends:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.7a3.5 3.5 0 010 6.6M18 14.2c2.3.6 3.7 2.6 3.7 5.8"/>',more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'};
const TABS=[['play','Играть'],['garage','Гараж'],['market','Рынок'],['friends','Друзья'],['more','Ещё']];

function render(){
 if(!S.ok){$('#top').innerHTML='';$('#nav').innerHTML='';$('#main').innerHTML=V.err?`<div class="empty"><i>🔌</i>${V.err}</div>`:'<div class="empty"><i>⏳</i>Загрузка…</div>';return}
 const lv=1+Math.floor(S.opened/10),p=(S.opened%10)*10;
 $('#top').innerHTML=`<div class="pill lvl"><span>Ур. ${lv}</span><i><u style="width:${p}%"></u></i></div><div class="pill">🍀 <span>${S.luck||1}×</span></div><div class="bal"><small>Баланс</small><b>${short(S.bal)}</b></div>`;
 $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${V.tab==k?'on':''}" data-a="tab" data-t="${k}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join('');
 $('#main').innerHTML=({play:playV,garage:garageV,market:()=>soon('🏪','Рынок игроков','Продажа и покупка машин между игроками появится после запуска сервера.'),friends:()=>soon('👥','Друзья','Приглашай друзей и получай награды. Скоро.'),more:moreV})[V.tab]();
 $('#layer').innerHTML=V.sheet?`<div class="ov" data-a="close"></div><div class="sheet">${sheetV()}</div>`:'';
}
function soon(i,t,d){return`<div class="empty"><i>${i}</i><h1>${t}</h1>${d}</div>`}
function playV(){const c=CASES[V.cs],d=V.drop,cost=c.p*V.n;
 let st;
 if(V.busy)st=V.n==1?`<div class="stage" ${col(V.cs)}><div class="reel"><div class="mark"></div><div class="strip" id="strip">${V.strip.map(item).join('')}</div></div><p>Открываем…</p></div>`:`<div class="stage" ${col(V.cs)}><span class="big">📦</span><h2>Открываем ×${V.n}…</h2></div>`;
 else if(d)st=`<div class="stage" ${col(d.t)}><span class="big">${T[d.t].e}</span><h2>${d.n}</h2><div class="t">${T[d.t].n} · ${fmt(d.v)}</div>${d.sold?'<p>✅ Продано</p>':`<p>Эта машина продастся за ${fmt(d.v)}</p><div class="btns"><button class="b2 g" data-a="sell1">Продать</button><button class="b2" data-a="tab" data-t="garage">В гараже</button></div>`}</div>`;
 else st=`<div class="stage" ${col(V.cs)}><span class="big">📦</span><h2>${c.n} кейс</h2><p>Открой кейс — машина появится здесь</p></div>`;
 return`<div class="row"><div class="seg"><b>Кейсы</b></div><button class="shop" data-a="sheet" data-s="shop">⭐ Магазин</button></div>
 <div class="chips">${CASES.map((x,i)=>`<button class="chip ${V.cs==i?'on':''}" data-a="cs" data-i="${i}"><s style="background:${T[i].c}"></s>${x.n}</button>`).join('')}</div>
 <div class="card row sp"><div><h3 style="color:${T[V.cs].c}">${c.n} кейс</h3><div class="mut">${c.o.map((o,t)=>o>0?T[t].n.slice(0,3)+'. '+o+'%':'').filter(Boolean).join(' · ')}</div></div><b class="price">${fmt(c.p)}</b></div>
 ${st}
 <div class="modes"><button class="chip ${V.n==1?'on':''}" data-a="mode" data-n="1">Открыть ×1</button><button class="chip ${V.n==5?'on':''}" data-a="mode" data-n="5">Открыть ×5</button></div>
 <div class="cta"><button class="go" data-a="spin" ${V.busy?'disabled':''}>${d?'Крутить ещё':'Открыть'} ×${V.n}<em>${fmt(cost)}</em></button></div>`}
function garageV(){const cs=S.cars;
 if(!cs.length)return`<h1>Гараж</h1>`+soon('🅿️','Гараж пуст','Открой кейс — выбитые машины окажутся здесь.');
 const g={};cs.forEach(c=>{g[c.n]=g[c.n]||{...c,k:0};g[c.n].k++});
 const rows=Object.values(g).sort((a,b)=>b.v-a.v).map(c=>`<div><span class="e">${T[c.t].e}</span><div class="n" style="color:${T[c.t].c}">${c.n}${c.k>1?' ×'+c.k:''}<small>${fmt(c.v)}</small></div><button class="mini" data-a="sellone" data-n="${c.n}">Продать</button></div>`).join('');
 let b='';for(let t=0;t<4;t++){const a=cs.filter(c=>c.t==t);if(a.length)b+=`<button class="btn" data-a="sellt" data-t="${t}"><span style="color:${T[t].c}">${T[t].n}</span> ×${a.length} · ${fmt(sum(a))}</button>`}
 return`<h1>Гараж · ${cs.length} шт.</h1><div class="card list">${rows}</div>${b}<button class="btn y" data-a="sella">Продать всё · ${fmt(sum(cs))}</button>`}
function moreV(){const lv=1+Math.floor(S.opened/10),w=Math.max(0,60-(now()-S.lw)/1000),dl=Math.max(0,864e5-(now()-S.ld));
 return`<div class="card row"><div class="ring" style="--p:${(S.opened%10)*10}%"><b>${lv}</b></div><div style="flex:1"><h3>Уровень ${lv}</h3><div class="mut">открыто кейсов: ${S.opened}</div></div><div style="text-align:right"><div class="mut">Баланс</div><h3>${short(S.bal)}</h3></div></div>
 <div class="grid4"><button class="tile" data-a="tab" data-t="garage"><span style="background:#30d85f">🏠</span>Гараж</button><button class="tile" data-a="work"><span style="background:#ff9f0a">🔨</span>Работа</button><button class="tile" data-a="daily"><span style="background:#ff375f">🎁</span>Бонус</button><button class="tile" data-a="top"><span style="background:#5e5ce6">🏆</span>Рейтинг</button><button class="tile" data-a="sheet" data-s="promo"><span style="background:#0a84ff">🎟</span>Промокод</button>${S.admin?'<button class="tile" data-a="sheet" data-s="adm"><span style="background:#8e8e93">🛠</span>Админка</button>':''}</div>
 <div class="shopc"><h2>Магазин</h2><p>Донат, наборы и усиления за ⭐</p><button class="open" data-a="sheet" data-s="shop">Открыть</button><div class="tags"><span>👑 VIP</span><span>🍀 Удача</span><span>📦 Кейсы</span><span>💰 Рубли</span></div></div>
 <div class="sec">СЕЙЧАС</div>
 <button class="card row sp" style="width:100%;text-align:left" data-a="daily"><div><h3>🎁 Ежедневный бонус</h3><div class="mut">${dl>0?'через '+Math.floor(dl/36e5)+' ч '+Math.floor(dl%36e5/6e4)+' мин':'можно забрать: '+fmt(20000)}</div></div></button>
 <button class="card row sp" style="width:100%;text-align:left" data-a="work"><div><h3>🔨 Подработка</h3><div class="mut">${w>0?'ещё '+Math.ceil(w)+' с':fmt(Math.round(150*(1+0.3*(lv-1))))+'–'+fmt(Math.round(400*(1+0.3*(lv-1))))+', раз в минуту'}</div></div></button>
 <div class="sec">АККАУНТ</div>
 <div class="card list"><div><div class="n">Лучший дроп<small>${S.best?fmt(S.best):'—'}</small></div></div><div><div class="n">Машин в гараже<small>${S.cars.length} шт. на ${fmt(sum(S.cars))}</small></div></div></div>`}
function sheetV(){const s=V.sheet;
 if(s.t=='shop')return`<h2>⭐ Магазин</h2><div class="sub">Оплата звёздами Telegram</div><div class="card list">${s.items.map(i=>`<div><div class="n">${i.title}<small>${i.desc}</small></div><button class="mini" data-a="buy" data-i="${i.id}">${i.stars} ⭐</button></div>`).join('')}</div><button class="btn g" data-a="close">Закрыть</button>`;
 if(s.t=='top')return`<h2>🏆 Рейтинг</h2><div class="sub">Деньги и машины</div><div class="card list">${s.rows.map((r,i)=>`<div style="${r.me?'color:var(--acc)':''}"><div class="n">${i+1}. ${r.n.replace(/</g,'&lt;')}${r.id?`<small>ID ${r.id}</small>`:''}</div><b>${short(r.v)}</b></div>`).join('')}</div><button class="btn g" data-a="close">Закрыть</button>`;
 if(s.t=='promo')return`<h2>🎟 Промокод</h2><div class="sub">Введи код, чтобы получить награду</div><input class="inp" id="p_code" placeholder="Код" autocapitalize="characters"><button class="btn g" data-a="promoGo">Применить</button>`;
 if(s.t=='adm')return`<h2>🛠 Админка</h2><div class="sub">ID игрока виден в рейтинге</div><input class="inp" id="a_id" inputmode="numeric" placeholder="ID игрока"><input class="inp" id="a_amt" inputmode="numeric" placeholder="Сумма ₽ (с минусом — забрать)"><div class="row"><button class="btn g" data-a="adm" data-op="bal">Выдать ₽</button><button class="btn" data-a="adm" data-op="luck">Удача ×10 · 2 ч</button></div><div class="row"><button class="btn" data-a="adm" data-op="ban1">Бан</button><button class="btn" data-a="adm" data-op="ban0">Разбан</button></div><input class="inp" id="a_code" placeholder="Промокод (например START)"><div class="row"><input class="inp" id="a_pamt" inputmode="numeric" placeholder="Сумма ₽"><input class="inp" id="a_uses" inputmode="numeric" placeholder="Раз"></div><div class="row"><input class="inp" id="a_pluck" inputmode="decimal" placeholder="Удача × (напр. 3.5)"><input class="inp" id="a_phours" inputmode="decimal" placeholder="Часов"></div><button class="btn y" data-a="adm" data-op="promo">Создать промокод</button><button class="btn" data-a="adm" data-op="stats">Статистика</button>`;
 const b=s.drops,best=b.reduce((m,d)=>d.v>m.v?d:m,b[0]),tot=sum(b),df=tot-s.cost;
 return`<h2>${b.length} открытий</h2><div class="sub">Лучший: <span style="color:${T[best.t].c}">${T[best.t].n.toLowerCase()}</span> · ${fmt(best.v)}</div><div class="card list">${b.map((d,k)=>`<div class="rv" style="animation-delay:${k*.14}s"><span class="e">${T[d.t].e}</span><div class="n" style="color:${T[d.t].c}">${d.n}<small>${T[d.t].n}</small></div><b>${fmt(d.v)}</b></div>`).join('')}</div><div class="sub">Всего ${fmt(tot)} за ${fmt(s.cost)} · <span style="color:${df>=0?'var(--acc)':'#ff6b6b'}">${df>=0?'+':'−'}${fmt(Math.abs(df))}</span></div><button class="btn y" data-a="sellb">Продать все за ${fmt(tot)}</button><button class="btn g" data-a="close">Отлично</button>`}
function ask(m,f){if(tg&&tg.showConfirm)tg.showConfirm(m,ok=>ok&&f());else if(confirm(m))f()}

async function spin(){if(V.busy||V.wait)return;const c=CASES[V.cs],n=V.n,cost=c.p*n;
 if(S.bal<cost){toast('Не хватает денег. Нужно '+fmt(cost));hap('heavy');return}
 V.wait=true;const j=await api('open',{ci:V.cs,n});V.wait=false;if(!j)return;
 const ds=j.drops,best=ds.reduce((m,d)=>d.v>m.v?d:m,ds[0]);
 V.busy=true;V.drop=null;V.strip=null;
 if(n==1){V.strip=[];for(let k=0;k<40;k++)V.strip.push(k==34?ds[0]:roll(V.cs))}
 render();hap();
 if(n==1){const st=$('#strip'),off=34*104+48-st.parentElement.clientWidth/2+(Math.random()*60-30);st.style.transition='none';st.style.transform='translateX(0)';st.getBoundingClientRect();st.style.transition='transform 3.4s cubic-bezier(.12,.7,.1,1)';st.style.transform=`translateX(${-off}px)`}
 await wait(n==1?3700:1200);
 V.busy=false;V.drop=best;if(n>1)V.sheet={t:'batch',drops:ds,cost};render();hap('heavy')}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;
 if(V.busy&&a!='close')return;
 if(a=='tab'){V.tab=D.t;V.sheet=null}
 else if(a=='cs')V.cs=+D.i;
 else if(a=='mode')V.n=+D.n;
 else if(a=='spin'){spin();return}
 else if(a=='close')V.sheet=null;
 else if(a=='sheet'){if(D.s=='shop'){const j=await api('shop');if(!j)return;V.sheet={t:'shop',items:j.items}}else V.sheet={t:D.s}}
 else if(a=='top'){const j=await api('top');if(!j)return;V.sheet={t:'top',rows:j.top}}
 else if(a=='buy'){const j=await api('invoice',{item:D.i});if(j&&tg&&tg.openInvoice)tg.openInvoice(j.url,async st=>{if(st=='paid'){toast('✅ Оплачено!');await api('state');render()}});return}
 else if(a=='promoGo'){const j=await api('promo',{code:($('#p_code')||{}).value||''});if(!j)return;toast('🎁 +'+fmt(j.gain)+(j.luck>1?' и удача '+j.luck+'× на '+j.hours+' ч':''));V.sheet=null}
 else if(a=='adm'){const v=id=>($('#'+id)||{}).value||'';let body={op:D.op,target:v('a_id'),amount:v('a_amt')};
  if(D.op=='luck'){body.mult=10;body.hours=2}
  if(D.op=='ban1'||D.op=='ban0'){body.op='ban';body.on=D.op=='ban1'}
  if(D.op=='promo')body={op:'promo',code:v('a_code'),amount:v('a_pamt'),uses:v('a_uses'),luck:v('a_pluck'),hours:v('a_phours')};
  const j=await api('adm',body);if(j)toast(j.stats?`Игроков: ${j.stats.n} · денег: ${fmt(j.stats.money)} · кейсов: ${j.stats.opened}`:'Готово');return}
 else if(a=='sell1'){const d=V.drop,j=await api('sell',{ids:[d.id]});if(!j)return;d.sold=true;toast('Продано за '+fmt(j.sum))}
 else if(a=='sellb'){const j=await api('sell',{ids:V.sheet.drops.map(d=>d.id)});if(!j)return;if(V.drop)V.drop.sold=true;V.sheet=null;toast('Продано за '+fmt(j.sum))}
 else if(a=='sellone'){const c=S.cars.find(x=>x.n==D.n);if(!c)return;const j=await api('sell',{ids:[c.id]});if(!j)return;toast('Продано за '+fmt(j.sum))}
 else if(a=='sellt'){const t=+D.t,l=S.cars.filter(c=>c.t==t),go=async()=>{const j=await api('sell',{scope:'t'+t});if(j){toast('Продано за '+fmt(j.sum));render()}};t>=2?ask('Продать все '+T[t].n.toLowerCase()+' машины за '+fmt(sum(l))+'?',go):go();return}
 else if(a=='sella'){ask('Продать ВСЕ машины за '+fmt(sum(S.cars))+'?',async()=>{const j=await api('sell',{scope:'all'});if(j){toast('Продано за '+fmt(j.sum));render()}});return}
 else if(a=='work'){const j=await api('work');if(!j)return;toast('🔨 Заработал '+fmt(j.gain));hap()}
 else if(a=='daily'){const j=await api('daily');if(!j)return;toast('🎁 +'+fmt(j.gain));hap()}
 render()});
render();
if(!(tg&&tg.initData)){V.err='Открой игру кнопкой «Играть» в боте Telegram.';render()}
else api('state').then(j=>{if(!j)V.err='Не удалось связаться с сервером. Проверь интернет и открой игру заново.';render()});
setInterval(()=>{if(V.tab=='more'&&!V.busy&&!V.sheet&&S.ok)render()},30000);
</script>
</body>
</html>
